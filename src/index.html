<!DOCTYPE html>
<html lang="en">

<head >
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Javier Tang | Portfolio</title>
  <meta name="description" content="Portfolio of Javier Tang - Cybersecurity & AI Specialist" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            serene: {
              900: '#0f172a', // Deep night blue
              800: '#112240', // Navy
              700: '#1e3a8a', // Rich blue
              600: '#0d9488', // Teal
              500: '#14b8a6', // Cyan/Teal Light
              400: '#2dd4bf', // Bright Teal
              300: '#5eead4', // Soft Cyan
              100: '#ccfbf1', // Mist
              50: '#f0fdfa',  // Cloud
            },
            accent: {
              gold: '#fbbf24', // Balloon/Sunlight gold
              rose: '#f43f5e', // Contrast pop
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #0d9488;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #14b8a6;
    }

    .glass-panel {
      background: rgba(17, 34, 64, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-serene-900 text-slate-200 antialiased selection:bg-serene-500 selection:text-serene-900">

</body>

</html>
